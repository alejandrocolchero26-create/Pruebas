networks:
  bigdata-net:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
  hadoop_namenode:
  hadoop_datanode:
  kafka_data:

services:
  # ==========================================
  # 1. BASE DE DATOS RELACIONAL (SQL)
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: bigdata_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bigdata-net

  # ==========================================
  # 2. BASE DE DATOS NO SQL
  # ==========================================
  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: adminpassword
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - bigdata-net

  # ==========================================
  # 3. MENSAJERÍA Y STREAMING (APACHE KAFKA 3.8.0 - KRaft)
  # ==========================================
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - bigdata-net

  # ==========================================
  # 4. ALMACENAMIENTO DISTRIBUIDO (APACHE HADOOP 3.4.0)
  # ==========================================
  namenode:
    image: apache/hadoop:3.4.0
    container_name: namenode
    hostname: namenode
    command: ["hdfs", "namenode"]
    environment:
      HADOOP_HOME: /opt/hadoop
      HDFS_CONF_dfs_namenode_rpc_address: "namenode:9000"
      HDFS_CONF_dfs_namenode_name_dir: "file:///hadoop/dfs/name"
    ports:
      - "9870:9870"
      - "9000:9000"
    volumes:
      - hadoop_namenode:/hadoop/dfs/name
    networks:
      - bigdata-net

  datanode:
    image: apache/hadoop:3.4.0
    container_name: datanode
    hostname: datanode
    command: ["hdfs", "datanode"]
    depends_on:
      - namenode
    environment:
      HADOOP_HOME: /opt/hadoop
      HDFS_CONF_dfs_namenode_rpc_address: "namenode:9000"
      HDFS_CONF_dfs_datanode_data_dir: "file:///hadoop/dfs/data"
    ports:
      - "9864:9864"
    volumes:
      - hadoop_datanode:/hadoop/dfs/data
    networks:
      - bigdata-net

  # ==========================================
  # 5. PROCESAMIENTO DISTRIBUIDO (APACHE SPARK 3.5.0)
  # ==========================================
  spark-master:
    image: apache/spark:3.5.0
    container_name: spark-master
    hostname: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"
      - "7077:7077"
    networks:
      - bigdata-net

  spark-worker:
    image: apache/spark:3.5.0
    container_name: spark-worker
    hostname: spark-worker
    depends_on:
      - spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    ports:
      - "8081:8081"
    networks:
      - bigdata-net
      
  # ==========================================
  # 6. ENTORNO PYTHON Y AUTOMATIZACIÓN (JUPYTER)
  # ==========================================
  jupyter:
    image: jupyter/pyspark-notebook:latest
    container_name: jupyter_bigdata
    depends_on:
      - spark-master
      - postgres
      - mongodb
      - kafka
    ports:
      - "8888:8888"
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - JUPYTER_TOKEN=bigdata
    volumes:
      - ./notebooks:/home/jovyan/work
    networks:
      - bigdata-net