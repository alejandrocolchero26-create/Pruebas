networks:
  bigdata-net:
    driver: bridge

volumes:
  hadoop_namenode:
  hadoop_datanode1:
  hadoop_datanode2:
  postgres_data:
  mongo_data:
  jupyter_notebooks:

services:
  # ==========================================
  # 1. BASE DE DATOS SQL: PostgreSQL
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: bigdata_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bigdata-net

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_ui
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@bigdata.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "5050:80"
    networks:
      - bigdata-net
    depends_on:
      - postgres

  # ==========================================
  # 2. BASE DE DATOS NoSQL: MongoDB
  # ==========================================
  mongodb:
    image: mongo:6.0
    container_name: mongo_db
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - bigdata-net

  mongo-express:
    image: mongo-express
    container_name: mongo_express_ui
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: rootpassword
      ME_CONFIG_MONGODB_URL: mongodb://root:rootpassword@mongodb:27017/
    networks:
      - bigdata-net
    depends_on:
      - mongodb

  # ==========================================
  # 3. STREAMING: Apache Kafka 3.8.0 (KRaft Mode)
  # ==========================================
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka_broker
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    networks:
      - bigdata-net

  # ==========================================
  # 4. ALMACENAMIENTO DISTRIBUIDO: Apache Hadoop 3.4.0
  # ==========================================
  namenode:
    image: apache/hadoop:3.4.0
    container_name: hdfs_namenode
    restart: always
    command: ["sh", "-c", "if [ ! -d /tmp/hadoop-root/dfs/name/current ]; then hdfs namenode -format; fi && hdfs namenode"]
    ports:
      - "9870:9870"
      - "9000:9000"
    environment:
      HADOOP_HOME: /opt/hadoop
      HDFS_CONF_dfs_replication: 2
      HDFS_CONF_dfs_permissions_enabled: "false"
    volumes:
      - hadoop_namenode:/tmp/hadoop-root/dfs/name
    networks:
      - bigdata-net

  datanode1:
    image: apache/hadoop:3.4.0
    container_name: hdfs_datanode1
    restart: always
    command: ["hdfs", "datanode"]
    environment:
      HADOOP_HOME: /opt/hadoop
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
    volumes:
      - hadoop_datanode1:/tmp/hadoop-root/dfs/data
    networks:
      - bigdata-net
    depends_on:
      - namenode

  datanode2:
    image: apache/hadoop:3.4.0
    container_name: hdfs_datanode2
    restart: always
    command: ["hdfs", "datanode"]
    environment:
      HADOOP_HOME: /opt/hadoop
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
    volumes:
      - hadoop_datanode2:/tmp/hadoop-root/dfs/data
    networks:
      - bigdata-net
    depends_on:
      - namenode

  # ==========================================
  # 5. PROCESAMIENTO: Apache Spark 3.5.0 (Oficial)
  # ==========================================
  spark-master:
    image: apache/spark:3.5.0
    container_name: spark_master
    restart: always
    command: ["/opt/spark/sbin/start-master.sh"]
    ports:
      - "8080:8080"
      - "7077:7077"
    networks:
      - bigdata-net

  spark-worker-1:
    image: apache/spark:3.5.0
    container_name: spark_worker_1
    restart: always
    depends_on:
      - spark-master
    ports:
      - "8081:8081"
    command: ["/opt/spark/sbin/start-worker.sh", "spark://spark-master:7077"]
    networks:
      - bigdata-net


  # ==========================================
  # 6. ENTORNO DE ANALÍTICA / PYTHON (ANACONDA/JUPYTER)
  # ==========================================
  jupyter-pyspark:
    image: jupyter/pyspark-notebook:latest
    container_name: jupyter_analytics
    restart: always
    ports:
      - "8888:8888"
    environment:
      - JUPYTER_ENABLE_LAB=yes
    volumes:
      - jupyter_notebooks:/home/jovyan/work
    networks:
      - bigdata-net
    depends_on:
      - spark-master
      - namenode
      - postgres
      - mongodb
      - kafka